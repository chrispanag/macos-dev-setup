# Mouse: click to focus panes (useful for Claude Code teammate panes), scroll, resize
set -g mouse on

# Large scrollback
set -g history-limit 50000

# 256-color and truecolor (Ghostty and plain xterm)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Low escape delay, important for Claude Code's TUI
set -sg escape-time 10

# Forward focus events to applications
set -g focus-events on

# Show the pane title on each pane border
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# prefix + j: project switcher in a popup (bin/tmux-project). -EE keeps the
# popup open if the script fails, so its error stays readable.
bind j display-popup -EE -w 70% -h 60% -e TMUX_PROJECT_HEIGHT=100% "~/.local/bin/tmux-project"

# --- Plugins (tpm from Homebrew; plugins install into ~/.tmux/plugins) ------
# Install/update: prefix + I / prefix + U
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 minutes and restore them when tmux starts
# (e.g. after a reboot). Manual: prefix + Ctrl-s to save, prefix + Ctrl-r to restore.
set -g @continuum-restore 'on'

# Keep last (tpm from Homebrew)
run "$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm"
