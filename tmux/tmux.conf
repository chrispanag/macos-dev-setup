# Mouse: click to focus panes (useful for Claude Code teammate panes), scroll, resize
set -g mouse on

# Large scrollback
set -g history-limit 50000

# Truecolor for xterm-like terminals (Ghostty's terminfo already advertises it;
# this covers plain xterm-256color, e.g. over SSH), plus extended keys, so
# Shift+Enter (newline in Claude Code) and other modified keys reach the apps
# that ask for them instead of arriving as plain Enter. A fixed array index
# rather than `set -as`, so reloading doesn't append duplicates.
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s terminal-features[100] "xterm*:RGB:extkeys"

# Number windows and panes from 1, and close the gaps when a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Low escape delay, important for Claude Code's TUI
set -sg escape-time 10

# Forward focus events to applications
set -g focus-events on

# Show the pane title on each pane border
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# --- Keys -------------------------------------------------------------------
# Splits and new windows open in the current pane's folder, not the session's
# root. prefix + | and prefix + - are easier to remember than % and ".
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + r: reload this config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# A grouped session (the same project open in a second Ghostty tab, see
# bin/tmux-project) is removed when its tab closes and another one in its group
# is still around. Sessions that aren't grouped are never touched.
set -g destroy-unattached keep-last

# prefix + j: project switcher in a popup (bin/tmux-project). -EE keeps the
# popup open if the script fails, so its error stays readable. Wrapped in
# run-shell, which expands #{client_name}, so the script acts on this client;
# display-popup doesn't expand formats in its command or -e values.
bind j run-shell -b "tmux display-popup -c '#{client_name}' -EE -w 70% -h 60% -e TMUX_PROJECT_HEIGHT=100% -e TMUX_PROJECT_CLIENT='#{client_name}' ~/.local/bin/tmux-project"

# --- Status bar and borders: Catppuccin Mocha, like Ghostty and Zed --------
# Left: the session (project) name, red while the prefix is waiting for a key.
# Windows: number and name, the current one highlighted, "+" when zoomed, and
# yellow with a bell after a terminal bell (e.g. Claude Code waiting for input)
# until you visit it. Right: every other session with such a window, so a
# waiting Claude in another project shows too.
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#f38ba8],#[bg=#cba6f7]}#[fg=#11111b,bold] #S #[default] "
set -g status-right-length 80
set -g status-right "#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}},#[fg=#f9e2af#,bold]🔔 #S #[default],}}#[fg=#a6adc8]%a %H:%M "
setw -g window-status-format "#{?window_bell_flag,#[bg=#f9e2af#,fg=#11111b#,bold] 🔔,#[fg=#7f849c]} #I #W#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I #W#{?window_zoomed_flag,+,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

# --- Plugins (tpm from Homebrew; plugins install into ~/.tmux/plugins) ------
# Install/update: prefix + I / prefix + U
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 minutes and restore them when tmux starts
# (e.g. after a reboot). Manual: prefix + Ctrl-s to save, prefix + Ctrl-r to restore.
set -g @continuum-restore 'on'
# Also save each pane's visible text and scrollback, so it's back after a restore
set -g @resurrect-capture-pane-contents 'on'

# Keep last (tpm from Homebrew)
run "$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm"
